<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password · T.GANG</title><meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fde4ef,#f9cfe2);padding:20px}
.rb{background:#fff7fb;border-radius:24px;padding:34px 28px;max-width:420px;width:100%;box-shadow:0 30px 80px #e0218a33}.rb h1{font-size:30px;margin:14px 0 8px}.rb label{display:block;font-size:12px;font-weight:600;margin:14px 0 6px}.rb input{width:100%;padding:13px 14px;border:1px solid #0002;border-radius:12px;font:15px inherit}.sa-msg{font-size:13px;margin-top:12px}.sa-msg.err{color:#b3261e}.sa-msg.ok{color:#1e7b3a}</style></head>
<body><main class="rb"><a href="./" class="logo"><img class="mono" src="assets/logo.jpg" alt="T.GANG logo"> T.GANG</a><h1>Choose a new password</h1>
<form id="rf" hidden><label for="p1">New password</label><input id="p1" name="p1" type="password" minlength="8" required autocomplete="new-password"><label for="p2">Repeat it</label><input id="p2" name="p2" type="password" minlength="8" required autocomplete="new-password"><button class="btn wide">Save password</button></form>
<p class="sa-msg" id="rmsg" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-config.js"></script><script src="reset.js"></script></body></html>
